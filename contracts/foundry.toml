[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']

# Compiler settings
solc_version = '0.8.19'
optimizer = true
optimizer_runs = 200

# Test settings
ffi = true
fs_permissions = [{ access = "read", path = "./" }]

# RPC endpoints
[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"

# Etherscan API keys
[etherscan]
base = { key = "${BASESCAN_API_KEY}" }